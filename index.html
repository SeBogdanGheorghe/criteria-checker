<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Availability Criteria Checker</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#F5F6F8;font-family:system-ui,sans-serif;}
  .loading{position:fixed;inset:0;display:grid;place-items:center;color:#6B7785;font-size:15px;}
  .frame{position:fixed;inset:0;border:0;width:100%;height:100%;}
  .help{position:fixed;right:14px;bottom:14px;font-size:12.5px;color:#16202E;background:#FFFFFF;border:1px solid #DDE2E8;border-radius:999px;padding:7px 14px;box-shadow:0 2px 10px rgba(22,32,46,.14);}
  .help a{color:#0B6E6E;font-weight:600;text-decoration:none;}
  .help a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="loading">Loading the Availability Criteria Checker…</div>
<!-- The app loads inside this frame, so the address bar keeps the short URL.
     clipboard-write lets the Copy summary / Copy JSON buttons work in-frame. -->
<iframe class="frame"
        src="https://script.google.com/a/macros/secretescapes.com/s/AKfycbwW9nnBxel2CePf0UbQUsRm5q3hL1WJv1OrMNqHP0zsJqbNweqedW_l7-HRPJ3QNDkO/exec"
        title="Availability Criteria Checker"
        allow="clipboard-write"></iframe>
<div class="help">Blank page? <a href="https://script.google.com/a/macros/secretescapes.com/s/AKfycbwW9nnBxel2CePf0UbQUsRm5q3hL1WJv1OrMNqHP0zsJqbNweqedW_l7-HRPJ3QNDkO/exec" target="_blank" rel="noopener">Sign in &amp; open directly</a></div>
</body>
</html>
